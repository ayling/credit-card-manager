plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.cardmanager'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.cardmanager'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs = ["${buildDir}/generated/webAssets"]
}

// 使用生成目录，不改写现有 src/main/assets 副本
tasks.register('syncWeb', Copy) {
    from("${rootDir}/..") { include 'index.html', 'style.css', 'app.js', 'knowledge.js' }
    into "${buildDir}/generated/webAssets"
}
preBuild.dependsOn syncWeb
